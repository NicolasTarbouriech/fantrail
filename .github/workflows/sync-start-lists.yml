name: Synchro des start lists

on:
  schedule:
    # 3 h à Paris en heure d'été
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Simulation, rien n'est écrit
        type: boolean
        default: true

concurrency:
  group: sync-start-lists
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx build cli-start-list
      - name: Synchro avec LiveTrail
        run: node dist/apps/cli/start-list/main.js sync --api https://fantrail-api.onrender.com/graphql ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          FANTRAIL_ADMIN_API_KEY: ${{ secrets.FANTRAIL_ADMIN_API_KEY }}
