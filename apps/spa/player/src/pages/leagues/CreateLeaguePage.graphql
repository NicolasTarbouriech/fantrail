query CreateLeaguePage {
  races {
    id
    name
    status
    fields {
      id
      startAt
    }
  }
}

mutation CreateLeaguePageMutateCreate(
  $name: String!
  $visibility: LeagueVisibility!
  $raceIds: [ID!]!
) {
  createLeague(name: $name, visibility: $visibility, raceIds: $raceIds) {
    id
  }
}
